<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const list = document.getElementById("all-articles");
  ARTICLES.forEach((a) => {
    list.innerHTML += `
      <a class="article-row" href="article-detail.html?id=${a.id}">
        <div class="thumb"><img src="${a.thumb}" alt="" /></div>
        <div class="content">
          <span class="date">${a.date}</span>
          <h3>${a.title}</h3>
          <p class="excerpt">${a.excerpt}</p>
        </div>
      </a>`;
  });
</script>
