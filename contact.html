<main>
  <section class="contact-hero">
    <div class="wrap contact-grid-v2">
      <div class="contact-form-col">
        <h1>Contact Me</h1>

        <form id="contact-form" action="https://formspree.io/f/xgogpvqd" method="POST">
          <div class="field-v2">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required placeholder="" />
          </div>
          <div class="field-v2">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="" />
          </div>
          <div class="field-v2">
            <label for="message">Message</label>
            <textarea id="message" name="message" required placeholder=""></textarea>
          </div>
          <p id="contact-error" class="hidden contact-error-msg">
            Something went wrong sending your message — try again, or email directly instead.
          </p>
        </form>
      </div>

      <div class="contact-whale-col">
        <p id="contact-hint" class="whale-hint">Click The Whale<br />To send your message!</p>
        <p id="contact-success-text" class="whale-hint hidden">Your Message Has Been<br />Conveyed To Bram!</p>

        <button type="submit" form="contact-form" class="whale-btn" aria-label="Send message">
          <img src="assets/dark/Whale.png" alt="" />
        </button>
      </div>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const form = document.getElementById("contact-form");
  const hint = document.getElementById("contact-hint");
  const successText = document.getElementById("contact-success-text");
  const errorMsg = document.getElementById("contact-error");
  const whaleBtn = document.querySelector(".whale-btn");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorMsg.classList.add("hidden");
    whaleBtn.disabled = true;
    whaleBtn.classList.add("whale-sending");

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" },
      });
      if (response.ok) {
        hint.classList.add("hidden");
        successText.classList.remove("hidden");
        form.reset();
      } else {
        throw new Error("Request failed");
      }
    } catch (err) {
      errorMsg.classList.remove("hidden");
    } finally {
      whaleBtn.disabled = false;
      whaleBtn.classList.remove("whale-sending");
    }
  });
</script>
