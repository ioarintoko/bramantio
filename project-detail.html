<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project — Bramantio Galih Arintoko</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  /* --- Tambahan CSS untuk Layout Project Detail --- */
  
  /* Ilustrasi Lochness Background */
  .lochness-bg {
    position: fixed;
    z-index: -1;
    pointer-events: none;
  }
  .lochness-bottom-left {
    bottom: -20px;
    left: -50px;
    height: 60vh; /* Sesuaikan ukuran dengan proporsi gambar asli */
  }
  .lochness-top-right {
    top: 50px;
    right: -50px;
    height: 35vh;
  }

  /* Penyesuaian Header Detail */
  .detail-header {
    text-align: center; /* Memusatkan konten keseluruhan */
    padding-top: 20px;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 24px;
    text-align: left;
    width: 100%;
  }

  /* Gaya Carousel */
  .project-carousel {
    display: flex;
    gap: 24px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 20px 0;
    margin-bottom: 40px;
    
    /* Menyembunyikan scrollbar untuk estetika */
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none;  /* IE and Edge */
  }
  .project-carousel::-webkit-scrollbar {
    display: none; /* Chrome, Safari and Opera */
  }

  .carousel-item {
    flex: 0 0 65%; /* Mengambil 65% lebar agar gambar di kiri/kanan sedikit terlihat */
    scroll-snap-align: center;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  .carousel-item img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
  }

  /* Gaya Teks Detail Proyek */
  .project-details {
    max-width: 800px;
    margin: 0 auto;
    text-align: left; /* Teks tetap rata kiri sesuai referensi */
  }
  .project-details h1 {
    font-size: 2.5rem;
    margin-bottom: 8px;
  }
  .project-details .stack-pill {
    display: inline-block;
    font-size: 0.9rem;
    font-weight: bold;
    margin-bottom: 24px;
    opacity: 0.9;
  }
  .project-details .desc {
    font-size: 1.1rem;
    line-height: 1.6;
  }
</style>
</head>
<body data-page="project">

<!-- Menambahkan Lochness Background (Pastikan path URL gambar sesuai dengan direktori Anda) -->
<img src="assets/lochness-green-left.png" alt="" class="lochness-bg lochness-bottom-left" />
<img src="assets/lochness-green-right.png" alt="" class="lochness-bg lochness-top-right" />

<header class="site-header">
  <nav class="navbar wrap">
    <a class="brand" href="index.html" aria-label="Home">
      <span class="brand-mark">B<span class="t">R</span><br />M<span class="t">N</span></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html" data-page="home">Home</a></li>
      <li><a href="article.html" data-page="article">Articles</a></li>
      <li><a href="profile.html" data-page="profile">Profile</a></li>
      <li><a href="project.html" data-page="project">Project</a></li>
      <li><a href="contact.html" data-page="contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="detail-header wrap">
    <a class="back-link" href="project.html">&larr; Back to projects</a>
    <div id="project-content"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Bramantio Galih Arintoko</span>
    <a href="contact.html">Say hello →</a>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const id = getParam("id");
  // Pastikan data fallback aman jika PROJECTS kosong
  const project = (typeof PROJECTS !== 'undefined' && PROJECTS.find((p) => p.id === id)) || PROJECTS[0];
  document.title = project.name + " — Bramantio Galih Arintoko";

  // Merestrukturisasi template HTML: Carousel diletakkan di atas, Detail di bawah
  document.getElementById("project-content").innerHTML = `
    <div class="project-carousel">
      ${project.gallery
        .map(
          (g) => `
        <div class="carousel-item">
          <img src="${g.src}" alt="${g.caption}" />
        </div>`
        )
        .join("")}
    </div>
    
    <div class="project-details">
      <h1>${project.name}</h1>
      <span class="stack-pill">${project.stack}</span>
      <p class="desc">${project.description}</p>
    </div>
  `;
</script>
</body>
</html>
