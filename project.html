<!DOCTYPE html>

<body data-page="project">

<header class="site-header">
  <nav class="navbar wrap">
    <a class="brand" href="index.html" aria-label="Home">
      <span class="brand-mark">B<span class="t">R</span><br />M<span class="t">N</span></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html" data-page="home">Home</a></li>
      <li><a href="article.html" data-page="article">Articles</a></li>

  </nav>
</header>

<main>
  <section class="section wrap" style="padding-top:20px;">
    <div class="section-head">
      <h2>Projects</h2>
    </div>
    <div class="grid-3" id="all-projects"></div>
  </section>

<footer class="site-footer">

    <a href="contact.html">Say hello →</a>
  </div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const grid = document.getElementById("all-projects");
  PROJECTS.forEach((p) => {
    grid.innerHTML += `
      <a class="card" href="project-detail.html?id=${p.id}">
        <div class="card-media"><img src="${p.cover}" alt="${p.name}" /></div>
        <div class="card-body">
          <h3>${p.name}</h3>
          <p class="card-stack">${p.stack}</p>
        </div>
      </a>`;
  });
</script>
